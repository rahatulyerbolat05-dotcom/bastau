name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/core.test.js tests/examples.test.js
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
